name: Release Android (Taiwan build)

# Push a tag such as v2.0.3-tw.2-tauri (the version must match package.json):
# builds the four Android ABIs with the fork's release keystore, signs them for the
# in-app updater and publishes the GitHub release the installed app updates from.
on:
  push:
    tags:
      - 'v*-tw.*-tauri'

permissions:
  contents: write

jobs:
  android:
    uses: ./.github/workflows/android-apk.yml
    secrets: inherit

  publish:
    name: Publish release
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # android-apk.yml leaves a draft; the in-app updater only sees published releases.
      - name: Publish the draft as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest -R "$GITHUB_REPOSITORY"
